[theme]
# Written by src/theme.py from config/theme.yaml: change the colours there, not here.
base = "light"
primaryColor = "#327F21"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1D1D1D"
linkColor = "#2F69D9"
borderColor = "#D5E3D0"
font = "sans serif"
chartCategoricalColors = ["#3370E7", "#327F21", "#8A7A00", "#1D1D1D"]

[theme.sidebar]
backgroundColor = "#F4F9F2"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1D1D1D"
primaryColor = "#327F21"
linkColor = "#28641A"
borderColor = "#D5E3D0"

[server]
headless = true
# Only this laptop can open the dashboard (not other devices on the same network): privacy.
address = "127.0.0.1"
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
