# Monthly targets per project and district for report-based indicators
# (the actual values are generated around these).
indicator_targets:
  WASH-01: {per_month: [150, 400]}   # people
  WASH-02: {per_month: [15, 45]}     # latrines
  WASH-03: {percent: [60, 80]}       # % households
  WASH-04: {per_quarter: [1, 4]}     # committees
  AGR-01: {per_month: [20, 60]}      # farmers per sex
  AGR-02: {per_month: [2, 8]}        # hectares
  AGR-03: {percent: [50, 70]}        # % farmers
  AGR-04: {per_quarter: [1, 3]}      # cooperatives

# -----------------------------------------------------------------------------
# Reconciliation scenario (decision log D132)
# -----------------------------------------------------------------------------
# For these indicators the monthly report values are worked out from the SAME true activity and
# register data the pipeline reads, so reported and derived values should agree. Discrepancies are
# then planted at known rates and logged in data/ground_truth/SYNTHETIC_planted_discrepancies.csv:
#   over-reporting   two officers inflate some of their monthly figures by 15 to 30%
#   under-reporting  some months are reported 20 to 50% too low
#   rounding         small 1 to 5% differences on larger numbers (should stay within the tolerance)
reconciliation_scenario:
  indicators:
    WASH-01: {truth: activity_participants, activity_ids: [ACT01], statuses: [completed, delayed]}
    AGR-01: {truth: unique_people, activity_ids: [ACT10]}
  over_reporting_officers: [FO01, FO04]   # FO01: WASH-01 in Nyagatare and Kayonza; FO04: AGR-01 in Rulindo
  over_report_share: 0.6           # share of those officers' months that are inflated
  over_report_pct: [15, 30]
  under_report_rate: 0.06
  under_report_pct: [20, 50]
  rounding_rate: 0.15
  rounding_pct: [1, 5]
  rounding_min_value: 20           # rounding differences only on values of at least 20

# -----------------------------------------------------------------------------
# How injected problems are grouped when the cleaning is scored (score_cleaning.py)
# -----------------------------------------------------------------------------
# officer_habits: consistent ways an officer formats things (not mistakes as such).
# genuine_errors: real mistakes. The 95% fixed-or-flagged target applies to these on their own.
# privacy: personal data that must be removed or pseudonymised.
error_groups:
  officer_habits:
    - date_dmy_text
    - date_excel_serial
    - date_month_year_text
    - number_as_text
    - sex_variant
    - disability_variant
    - status_variant
    - province_variant
    - district_variant
    - phone_leading_zero_lost
    - id_stored_as_number
    - stage_variant
    - donor_type_variant
    - donor_name_variant
    - probability_format
    - percent_as_fraction
    - amount_in_usd
    - title_row
    - merged_header_row
    - totals_row
    - blank_row
    - date_new_format           # held-out set only
    - district_old_name         # held-out set only (e.g. Butare for Huye)
    - district_abbreviation     # held-out set only
  genuine_errors:
    - duplicate_beneficiary
    - duplicate_activity_row
    - sum_mismatch
    - female_exceeds_total
    - negative_value
    - accuracy_outlier
    - percent_over_100
    - impossible_age
    - impossible_household_size
    - district_typo
    - district_wrong_province
    - transcription_error
    - missing_required
    - missing_target
    - missing_monthly_report
    - late_entry
    - status_completed_but_late
    - date_out_of_window
    - sex_ambiguous_code_1
  # Not errors: different people who share a name. Correct handling = keep them apart.
  matching_traps:
    - namesake_different_person
  privacy:
    - personal_data_individual_donor
    - personal_data_contact

