# =============================================================================
# Synthetic data generator settings (used ONLY by src/generate_synthetic.py)
# =============================================================================
# Everything in this file is INVENTED for demonstration. None of it describes
# ARDE/KUBAHO's real programmes, projects, staff, donors or beneficiaries.
# When real data arrives this file is no longer used.
# =============================================================================

seed: 2023                         # fixed so every run produces identical files

# How many records to aim for (brief Section 6)
volumes:
  beneficiaries: 1500              # unique people (before duplicates are added)
  activity_records: 3000           # approximate; spread over projects, districts, months
  services_per_beneficiary: [1, 5] # each person receives between 1 and 5 services
  donors: 25
  opportunities: 30
  paper_share_activities: 0.12     # share of activity records that only exist on paper
  paper_share_beneficiaries: 0.15  # share of registrations that only exist on paper

# -----------------------------------------------------------------------------
# Rates at which problems are deliberately injected. Each rate is a share of the
# eligible cells or rows (0.05 = 5%). Exact injected counts are written to
# data/ground_truth/SYNTHETIC_injected_errors_summary.csv on every run.
# -----------------------------------------------------------------------------
injection_rates:
  district_variant: 0.15           # NYAGATARE, Nyagatare District, nyagatare, extra spaces
  district_typo: 0.04              # Nyagatre, Kayonzaa
  district_wrong_province: 0.02    # district written next to the wrong province
  sex_ambiguous_code_1: 0.025      # sex written as "1" (only some officers do this)
  duplicate_beneficiary: 0.04      # same person registered twice with a different spelling
  duplicate_activity_row: 0.015    # identical activity row entered twice
  number_as_text: 0.10             # "1,250,000", "450 RWF", "45 " stored as text
  negative_value: 0.008            # negative participants or cost
  female_exceeds_total: 0.012      # e.g. 120% female participation
  sum_mismatch: 0.03               # female + male does not equal total
  date_out_of_window: 0.006        # year typos such as 2042 or 2203
  late_entry: 0.08                 # entry date more than 30 days after the activity (officer files)
  delayed_activity: 0.12           # true share of activities done well after their planned date
  cancelled_activity: 0.03         # true share of activities cancelled
  status_says_completed_but_late: 0.30   # share of LATE activities wrongly labelled "completed"
  missing_required: 0.02           # required cell left blank (officer files)
  missing_required_paper: 0.12     # required cell left blank (digitised paper file)
  paper_transcription_error: 0.06  # O typed for 0, l for 1, swapped digits, letter slips
  impossible_age: 0.006
  impossible_household_size: 0.006
  missing_target: 0.06             # target cell blank in an indicator report
  accuracy_outlier: 0.02           # actual more than 3 x target
  percent_over_100: 0.03           # a percentage indicator above 100
  percent_as_fraction: 0.08        # 72% typed as 0.72
  missing_monthly_report: 0.05     # a whole project/district/month report not submitted
  blank_row: 0.02                  # empty rows scattered through officer files

# -----------------------------------------------------------------------------
# Fictional field staff. Codes only: staff names are personal data too.
# Each officer has their own (inconsistent) way of laying out Excel files.
# -----------------------------------------------------------------------------
field_officers:
  FO01: {districts: [Nyagatare, Kayonza], layout: A}
  FO02: {districts: [Bugesera, Kirehe], layout: B}
  FO03: {districts: [Nyamagabe, Huye], layout: C}
  FO04: {districts: [Rulindo, Karongi], layout: D}
paper_data_entry_clerk: DE01

