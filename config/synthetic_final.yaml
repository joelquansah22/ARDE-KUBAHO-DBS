holdout_mess:
  new_date_format_rate: 0.08
  new_date_styles: [mon_d_yyyy, d_slash_mon_yyyy, ymd_dotted, ordinal_long]
  district_new_variant_rate: 0.06
  district_variant_kinds: [space_inside, with_province, vowel_change, prefix_typo, old_name]
  dup_variant_kinds: [initials, hyphen, extra_name, surname_slip]
  dup_phone_missing: 0.50
  dup_id_kept: 0.30
  namesake_rate: 0.04
  namesake_close_age: 0.50
  namesake_phone_missing: 0.50
  namesake_id_missing: 0.50

# reconciliation_scenario and calibration are inherited from synthetic.yaml: ON.

expected_fingerprint: null          # filled in after the first generation (it only guards later regenerations)
