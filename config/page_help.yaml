# =============================================================================
# "How to read this page": the short guide shown (collapsed) at the top of each
# dashboard page. Plain British English, for programme staff. Edit freely: the
# dashboard reads this file every time a page opens. One entry per page.
# "summaries" is the one line under each page title: the question the page answers.
# =============================================================================

# The menu: one list for the sidebar (grouped under the section headings) and the menu tiles on the Home page.
# file: the page's file in dashboard/; url: the address after http://localhost:8501/ ; icon: a Material icon
# (https://fonts.google.com/icons, written :material/name:); description: one line, shown on the Home page tile.
menu:
  - section: ""                 # no heading: Home, at the top
    pages:
      - {key: start, file: start.py, title: Home, icon: ":material/home:", url: "", description: "Key figures, what needs attention, and every page"}
  - section: Insights
    pages:
      - {key: home, file: summary.py, title: Executive summary, icon: ":material/space_dashboard:", url: summary, description: "On track, trustworthy, funded: the three questions on one screen"}
      - {key: overview, file: pages/1_Programme_Overview.py, title: Programme overview, icon: ":material/monitoring:", url: overview, description: "People reached, activities, spending and targets by project"}
      - {key: indicators, file: pages/2_Indicators.py, title: Indicators, icon: ":material/flag:", url: indicators, description: "Each MEAL indicator against its target, and reports against records"}
      - {key: geography, file: pages/3_Geography.py, title: Geography, icon: ":material/map:", url: geography, description: "Results by district, on a map"}
      - {key: data_quality, file: pages/4_Data_Quality.py, title: Data quality, icon: ":material/fact_check:", url: data-quality, description: "Quality score, records held back, the review queue"}
  - section: Data
    pages:
      - {key: data_entry, file: pages/7_Data_Entry.py, title: Data entry, icon: ":material/edit_note:", url: data-entry, description: "Type in activity records and monthly indicator reports"}
      - {key: upload_excel, file: pages/8_Upload_Excel.py, title: Upload Excel, icon: ":material/upload_file:", url: upload-excel, description: "Check and add a filled Excel template; blank templates"}
      - {key: records, file: pages/9_Records.py, title: Records, icon: ":material/table_view:", url: records, description: "Search every record, see where it came from, export to Excel"}
  - section: Donors
    pages:
      - {key: donor_pipeline, file: pages/5_Donor_Pipeline.py, title: Donor pipeline, icon: ":material/handshake:", url: donor-pipeline, description: "Open opportunities, deadlines and the weighted pipeline"}
      - {key: donor_entry, file: pages/6_Donor_Entry.py, title: Donor entry, icon: ":material/volunteer_activism:", url: donor-entry, description: "Add and update donors and opportunities"}

# Pages where the sidebar's sex filter does not apply (it is shown greyed out).
no_sex_filter: [data_quality, donor_pipeline, donor_entry, data_entry, upload_excel, records]

summaries:
  start: "Programme and donor data in one place: what needs attention today, and where to find everything."
  home: "Are we on track this quarter, can we trust the numbers, and what funding is coming up?"
  overview: "How many people and activities, how much spent, and how each project compares with its targets."
  indicators: "Each MEAL indicator against its target, month by month, and where reports and records disagree."
  geography: "Where people are reached, activities take place and money is spent, by district."
  data_quality: "How complete and correct the records are, and which records need correcting or checking."
  donor_pipeline: "Which funding opportunities are open, what they are worth, and what is due next."
  donor_entry: "Add and update donors and funding opportunities; every change is recorded."
  data_entry: "Enter this month's activity records and indicator reports; every change is recorded."
  upload_excel: "Upload a filled Excel template: see what is accepted, held back or sent for review, then add it."
  records: "Browse and search every stored record, see where it came from, and export it to Excel."

home: |
  - This page answers three questions for the current fiscal quarter: are we on track, can we trust the numbers, and what funding is coming up.
  - **On track** counts each indicator once (or once per project when you choose a programme). ✔ on track = 90% or more of target, ▲ at risk = 70 to 89%, ✖ off track = below 70%. Indicators without a complete target are counted separately, never as on track.
  - **Can we trust these numbers?** The data-quality score is the average of six checks (completeness, validity, consistency, uniqueness, timeliness, accuracy). "Gaps" are months or quarters where the monthly report and the activity or register records disagree by more than 10% and at least 5.
  - **Funding**: deadlines are for opportunities that are still open. The weighted pipeline is each amount requested times its chance of success. The pipeline gap is a draft definition, to be agreed.
  - Each block links to the page with the details. The sidebar filters apply here too.

overview: |
  - The four tiles count **different people** (not attendance), activities completed, the share of women, and activity spending in the date range you choose.
  - "Pending duplicate review" means people who may be registered twice; until someone checks them, people counts may be slightly high.
  - **Budget by project** compares all activity spending to date with each project's whole budget (the date filter does not apply). ▲ means over budget.
  - **Target versus actual**: the words above each bar give the status. A hatched bar is the target for only the months that have one.
  - **Cost per person reached** is a draft measure: activity cost divided by the people reached as reported, for projects that report reach.
  - The **donor report** button makes a one-page quarterly summary (Excel and PDF) for one project.

indicators: |
  - One row per indicator. **Actual** comes from the monthly reports where the indicator is reported; "(worked out)" means it is calculated from the activity, register and report files.
  - **% achieved** compares the actual with the target. "Partial, 2 of 3 months" means only some months had a target, so the % covers those months only.
  - **Compared with records** shows what the activity or register records say for the same thing. A big difference is listed under "Gaps to follow up".
  - **Coverage** appears when a figure could only be worked out from part of the data.
  - In the drill-down, an open diamond marks a month that includes records still in the review queue.
  - In the reconciliation, open "Report to check" to find the report row in the Excel file.

geography: |
  - Choose what to show. People are counted in the district where they **registered**; activities and spending in the district where the activity **took place**.
  - Grey districts on the map have no data in your selection. "Unknown district" (bar chart and table only) is people whose registration records are all quarantined.
  - The district total in the table is the same as the Programme overview total when no district is chosen.

data_quality: |
  - This page covers **every record in the source files**, so the filters do not apply.
  - **Quarantined** records broke a critical rule (for example a required field left blank or an impossible value). They are kept aside and not counted until corrected in the Excel file.
  - **Review queue** records are counted, but a person should check them (for example women + men do not equal the total).
  - **Work lists**: choose a field officer to see and download only their records, to send them for correction.
  - After correcting the Excel files, run the pipeline again (see the user guide).

donor_pipeline: |
  - **Open opportunities** are those not yet decided (Identified to Proposal submitted). Awarded and Declined are outcomes and are shown separately.
  - **Weighted value** = amount requested × probability of success. It is a planning figure, not money expected for certain.
  - An opportunity that fits two themes is split half and half, so the themes add up to the total.
  - The **pipeline gap** compares the annual budget of projects ending within 12 months with the weighted pipeline for their theme. Draft definition, to be agreed with ARDE/KUBAHO.
  - **Overdue next actions** are open opportunities whose next action date has passed.

donor_entry: |
  - **Choose your name** first ("You are"). There is no login: every change is recorded with your staff code in the change history.
  - **New opportunity** and **New donor** add entries; fields marked * are required. The deadline must be in the future, the probability between 0% and 100%, and an awarded opportunity needs its amount.
  - **Individual donors are never named**: leave the name empty; they appear as "Individual donor #NNN". No contact names, emails or phone numbers are stored here.
  - **Update an opportunity** changes the stage, amounts, probability, deadline, next action or owner of opportunities added on this page. Opportunities in the Excel tracker are updated in the Excel file.
  - **Next actions**: "Mark done" keeps the action in the change history and clears it; then add the next one.
  - New entries reach the Donor pipeline and Executive summary pages when the figures are updated: use the button at the bottom of the page.

data_entry: |
  - **Choose your name** first ("You are"). There is no login: every change is recorded with your staff code in the change history.
  - **New activity record**: the lists depend on each other: choose the project first (then its activities and districts), then the district, sector, cell and village.
  - Entries are checked with **the same rules as Excel rows**: women + men must equal the total, no negative numbers, the date within the project and not in the future, valid codes. If something is wrong, nothing is saved and the page says what to correct. If something only needs checking, the entry is saved and goes to the MEAL officer's review queue.
  - **New monthly indicator report**: one entry per project, district, month and indicator (and sex, for indicators reported for women and men separately). The page lists the months still missing. A report already in an Excel file is refused: correct the Excel file instead.
  - **Records from Excel files are read-only here**: correct them in the Excel file and upload it again (Upload Excel page). Entries made on this page are changed on the "Change an entry" tab.
  - New entries reach the other pages when the figures are updated: use the button at the bottom of the page.

upload_excel: |
  - **Choose your name** first ("You are"): the upload is recorded with your staff code and the date.
  - Download a **blank template**, fill it in Excel, then upload it. The kind of file is worked out from its sheets; change it if it is wrong.
  - **Check the file** reads it exactly as the pipeline would. Nothing is added yet. **Accepted** rows go into the figures; rows **held back for correction** are not counted until they are corrected (the row number and the reason are listed); rows **sent for review** are counted and checked by the MEAL officer. A **SKIPPED** message means a whole sheet could not be read, usually because a required column is missing.
  - A warning appears if **the same file**, or a file with **the same records**, was already uploaded. If the new file is a corrected version, choose to replace the earlier file: it is kept in data/app/replaced_files/, never deleted.
  - **Add this file** keeps it, records it in the list at the bottom, and updates the figures (about 20 seconds).

records: |
  - Choose a **table**. The sidebar's project, district and date filters apply where the table has them; officer, status, source and search are on this page.
  - **Origin** says where each record came from: the Excel file, sheet and row (and who uploaded the file, and when), or the app entry, who made it and when.
  - **Held back for correction** and **Review queue** list rows from every file, with the reason. People (beneficiaries) are never listed: no names, phones or ID numbers.
  - **Export this view to Excel** downloads exactly what is shown, with an "About" sheet giving the filters.
  - This page is read-only: correct Excel records in their file and upload it again; change app entries on the Data entry or Donor entry page.
