# =============================================================================
# MEAL indicator catalogue (SOURCE OF TRUTH for indicator definitions)
# =============================================================================
# STATUS: PHASE 1 STUB. DRAFT, FOR CO-DESIGN WITH ARDE/KUBAHO STAFF.
#
# Only the identifying fields are filled in for now so that the synthetic data
# can use the same codes. Phase 4 adds the full definition, numerator,
# denominator, calculation rule, target-setting rule, data source, owner and notes.
#
# Field meanings:
#   code            short unique code; never reuse a code for a different indicator
#   level           output or outcome
#   unit            number, percent, hectares, RWF
#   higher_is_better true if a bigger number is good (the "direction" of the indicator)
#   frequency       monthly, quarterly, semi-annual, annual
#   disaggregation  how results are broken down (none, sex)
#   source          report = entered by staff in the monthly indicator report
#                   computed = calculated by the pipeline from activity records
# =============================================================================

catalogue_status: "Draft, for co-design with ARDE/KUBAHO staff (Phase 1 stub)"

indicators:
