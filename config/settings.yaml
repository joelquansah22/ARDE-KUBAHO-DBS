# =============================================================================
# ARDE/KUBAHO MEAL prototype: main settings
# =============================================================================
# This is the file to edit when something about the organisation changes
# (paths, the exchange rate, thresholds, allowed values).
# You should not need to edit any Python code for these.
#
# Format notes for Excel users:
#   - Lines starting with # are comments and are ignored.
#   - Indentation matters: use spaces, never tabs.
#   - Text after a colon is the value. Keep the spacing as you see it.
# =============================================================================

# While this is true, every file name starts with SYNTHETIC_ and every dashboard
# page shows the banner below. Set to false only when real partner data is in use.
synthetic_mode: true
synthetic_banner: "Demonstration data. Synthetic records, not ARDE/KUBAHO data."

# -----------------------------------------------------------------------------
# Folders (relative to the project folder)
# -----------------------------------------------------------------------------
paths:
  raw: data/raw                    # messy input files go here
  staging: data/staging            # cleaned, pseudonymised tables
  warehouse: data/warehouse/arde.duckdb
  exports: data/exports            # CSV/Parquet star schema for Power BI
  ground_truth: data/ground_truth  # synthetic answer key; NEVER read by the pipeline
  holdout_raw: data/holdout/raw                    # held-out synthetic test set (see synthetic_holdout.yaml)
  holdout_ground_truth: data/holdout/ground_truth
  holdout_staging: data/holdout/staging
  holdout_manual: data/holdout/manual              # hand-made messy files from teammates
  holdout_fo05_staging: data/holdout/staging_with_fo05_mapping   # held-out 1 re-run with the FO05 mapping overlay
  holdout2_raw: data/holdout2/raw                  # held-out set 2 (fresh seed and mess; never used for tuning)
  holdout2_ground_truth: data/holdout2/ground_truth
  holdout2_staging: data/holdout2/staging
  holdout2_fix1_staging: data/holdout2/staging_after_round4_fixes        # recovery runs on SEEN data
  holdout2_fo06_staging: data/holdout2/staging_after_fixes_with_fo06_mapping
  final_raw: data/final_holdout/raw                # Phase 7 final held-out round (config/synthetic_final.yaml)
  final_ground_truth: data/final_holdout/ground_truth
  final_staging: data/final_holdout/staging
  app_entries: data/app/entries.db                 # donor tracking entered on the dashboard (SQLite)
  templates: templates
  docs: docs

# -----------------------------------------------------------------------------
# Privacy
# -----------------------------------------------------------------------------
# The salt is a secret random value used to pseudonymise names, phone numbers and
# ID numbers. It must live OUTSIDE the project folder so it is never shared or
# committed. "~" means your Windows user folder (for example C:\Users\YourName).
# If the file does not exist, the pipeline creates it the first time it runs.
# Losing the salt means new hashes will not match old ones: back it up safely.
privacy:
  salt_file: "~/.arde_meal/pseudonymisation_salt.txt"
  individual_donor_label: "Individual donor #{number:03d}"

# -----------------------------------------------------------------------------
# Dates and money
# -----------------------------------------------------------------------------
fiscal_year:
  start_month: 7                   # Rwanda fiscal year runs July to June

reporting_window:
  start: 2023-07-01
  end: 2026-06-30

# Date used as "today" for deadlines and overdue actions while on synthetic data.
# Set to null to use the real current date.
as_of_date: 2026-06-30

# Donor entries (data/app/entries.db): dated backups are kept in data/app/backups/, after every save and each time
# the dashboard starts. Only the newest this-many are kept.
app_backups_keep: 30

# Activity records and indicator reports entered on the dashboard are checked with the cleaner's rules.
# Anything that would hold a row back (critical) is refused; so are these, which for an Excel row only go to
# the review queue (a form can insist on them):
app_entry:
  refuse: [sum_mismatch]             # women + men must equal the total

budget_monitoring:
  # A project whose activity spending to the as-of date is above this % of its budget
  # gets a warning: "over budget by RWF X (Y%)". Activity costs only (no staff or overheads).
  over_budget_pct: 100

currency:
  show_usd_option: true            # false = the dashboard shows RWF only (no RWF/USD switch)
  usd_to_rwf: 1450                 # TO BE CONFIRMED: update from the BNR rate when reporting

# -----------------------------------------------------------------------------
# Allowed values and recoding (used by clean.py and validate.py)
# -----------------------------------------------------------------------------
# Any value not listed here is NOT guessed: it is flagged for review.
# Matching ignores upper/lower case and spaces at either end.
sex_mapping:
  female: [Female, F, Gore, Woman, Women]
  male: [Male, M, Gabo, Man, Men]
  # "1" and "2" are deliberately NOT mapped: different officers use them differently.
  # Add them above only once the partner confirms the coding.

disability_mapping:
  "yes": ["Yes", "Y", "Yego", "1", "True"]
  "no": ["No", "N", "Oya", "0", "False"]

activity_status_values: [planned, completed, delayed, cancelled]
activity_status_mapping:
  planned: [Planned, Scheduled, Not yet]
  completed: [Completed, Complete, Done]
  delayed: [Delayed, Late]
  cancelled: [Cancelled, Canceled]

# -----------------------------------------------------------------------------
# Data-quality thresholds
# -----------------------------------------------------------------------------
data_quality:
  late_entry_days: 30              # entry more than this many days after the activity = late
  on_time_tolerance_days: 7        # activity done within this many days of its planned date = on time
  accuracy_outlier_ratio: 3.0      # actual > 3 x target is flagged for review
  date_window_grace_days: 31       # activity dates up to this many days outside the project window are accepted
  age_min: 0
  age_max: 110
  household_size_min: 1
  household_size_max: 25
  # Age bands used on the dashboard (lower bound of each band, in years).
  age_bands: [0, 18, 25, 35, 50, 65]

# Fuzzy matching of duplicate beneficiaries (ingest.py). Score is 0 to 100;
# higher means names must be more alike before two records are treated as one person.
duplicate_matching:
  name_similarity_threshold: 88
  # Similar names alone are never enough to merge two people: a matching phone (within the
  # digit limit below) or national ID is also needed. Name-only matches go to the review queue.
  merge_requires_phone_or_id: true
  # Initials ("J. C. Uwimana") are compared with full names ("Jean Claude Uwimana"): same district,
  # surname scoring at least this much, ages known and close. Matches go to REVIEW only, never merged.
  initials_rule: true
  initials_surname_min_score: 90
  require_same_district: true      # only compare people registered in the same district
  require_same_sex: true           # only compare people of the same sex (when both are known)
  # Even when names are alike, two records are kept apart if any of these disagree:
  max_phone_digit_difference: 1    # phones differing in more than 1 digit = different people
  max_age_difference_years: 2      # ages differing by more than 2 years = different people
  compare_id_digits: 15            # compare the first 15 digits of the ID (Excel drops the 16th)
  # Other thresholds tried when scoring the synthetic data (for justifying the setting above).
  thresholds_to_compare: [80, 85, 88, 92]

# -----------------------------------------------------------------------------
# Cleaning rules (clean.py)
# -----------------------------------------------------------------------------
cleaning:
  date_day_first: true             # 03/04/2024 means 3 April (Rwandan practice)
  excel_serial_range: [20000, 80000]   # whole numbers in a date column inside this range are Excel dates
  month_only_day: 1                # "March 2024" is stored as 1 March and flagged "day unknown"
  # Day-month-year dates written with a month NAME, e.g. "12 Mar 24", "12 March 2024", "12-Mar-2024".
  # Codes: %d day, %b short month name (Mar), %B full month name (March), %y 2-digit year, %Y 4-digit year.
  date_text_formats: ["%d %b %y", "%d %B %y", "%d %b %Y", "%d %B %Y", "%d-%b-%y", "%d-%b-%Y",
                      "%d-%B-%Y", "%d/%b/%y", "%d/%b/%Y", "%d.%b.%Y", "%d %b, %Y", "%d %B, %Y",
                      "%Y.%m.%d"]   # %m = month number; "%Y.%m.%d" is 2024.03.12 (year first)
  # Month-first dates such as "Mar 12, 2024" are deliberately NOT accepted (question for the partner).
  ordinal_suffixes: [st, nd, rd, th]   # "12th March 2024" is read as "12 March 2024"
  # A 2-digit year up to this number means 20xx, above it 19xx ("24" = 2024, "57" = 1957).
  two_digit_year_pivot: 30
  # Words removed before matching a district, e.g. "Nyagatare District", "Akarere ka Huye".
  district_noise_words: [district, akarere ka, akarere, karere ka]
  district_fuzzy_min_score: 80     # closest district name accepted only above this score (0 to 100)
  village_fuzzy_min_score: 85      # same, for village names within the stated district
  # Text removed when reading a number, e.g. "1,250,000 RWF", "45 people", "12 ha".
  number_noise_words: [rwf, frw, people, ppl, persons, pers, ha, hectares]
  usd_markers: [usd, us$, $]
  # Letters that are typos for digits when typed into a number (paper transcription).
  letter_digit_fixes: {O: "0", o: "0", l: "1", I: "1"}
  # A percentage indicator typed between 0 and 1 (e.g. 0.72) is read as a fraction (72%).
  percent_fraction_max: 1.0
  # Labels that mark a totals row (row is removed, not counted). A row counts as a totals row if
  # its first filled cell is one of these words, possibly followed by more text such as
  # "Total (RWF)" or "Totals:", AND the rest of the row holds only numbers, formulas or blanks.
  # Any row containing a formula such as =SUM(...) is also treated as a totals row.
  totals_labels: [total, totals, grand total, sub total, subtotal, sub-total, igiteranyo, sum]
  # A row counts as the header only if at least this many of its cells are known column names
  # (config/source_mappings.yaml). A sheet with no such row is SKIPPED and reported, never guessed.
  header_min_matches: 3
  probability_words_flag: [high, medium, low]   # words cannot be turned into a number: flagged

# -----------------------------------------------------------------------------
# Indicator traffic lights (% of target achieved)
# -----------------------------------------------------------------------------
traffic_light:
  on_track_min: 90                 # >= 90% achieved
  at_risk_min: 70                  # 70 to 89% achieved; below 70% is off track

# -----------------------------------------------------------------------------
# Indicators (indicators.py)
# -----------------------------------------------------------------------------
indicators:
  # Periods every indicator is worked out for. Quarters follow the fiscal year:
  # Q1 = July to September, Q2 = October to December, Q3 = January to March, Q4 = April to June.
  period_types: [month, quarter, fiscal_year]
  # Reported and derived values more than this far apart (as a % of the reported value) are flagged.
  reconciliation_tolerance_pct: 10
  # ...AND at least this many apart (in the indicator's unit). Stops tiny numbers being flagged:
  # reported 4 against 3 in the records is 33% but only 1 person.
  reconciliation_min_difference: 5
  # Words shown instead of a % achieved.
  no_target_label: no target set
  target_incomplete_label: target incomplete      # some months in the period have no target

# -----------------------------------------------------------------------------
# Donor pipeline
# -----------------------------------------------------------------------------
donor_pipeline:
  stages: [Identified, Qualified, Concept note, Proposal submitted, Awarded, Declined]
  stage_mapping:
    Identified: [Identified, Idea, Prospect]
    Qualified: [Qualified, Eligible, Go decision]
    Concept note: [Concept note, CN, CN submitted, Concept]
    Proposal submitted: [Proposal submitted, Proposal sent, Submitted, Full proposal]
    Awarded: [Awarded, Won, Grant signed]
    Declined: [Declined, Lost, Rejected, Unsuccessful]
  donor_type_mapping:
    bilateral: [bilateral, bilateral donor, bi-lateral]
    multilateral: [multilateral, multi-lateral, un / multilateral]
    foundation: [foundation, private foundation, trust/foundation, trust]
    government: [government, govt, local government]
    private: [private, private sector, company]
    individual: [individual, individual (diaspora), private individual]
  deadline_windows_days: [30, 60, 90]
  # Stages that are still open (not yet decided). Awarded and Declined are outcomes.
  open_stages: [Identified, Qualified, Concept note, Proposal submitted]
  # An opportunity that fits more than one theme ("WASH; Agriculture") has its value split
  # equally between them, so the themes always add up to the total pipeline.
  multi_theme_allocation: split_equally
  # Themes shown for the pipeline. They match dim_programme.thematic_area.
  themes: [WASH, Agriculture]
  # "Pipeline gap": projects ending within this many months, against the weighted pipeline for their theme.
  # The definition is ours: to be confirmed with partner.
  ending_within_months: 12

# -----------------------------------------------------------------------------
# What happens to each kind of flag (three levels)
# -----------------------------------------------------------------------------
#   critical: the row is QUARANTINED (kept aside, not used in results) until the
#             source file is corrected. Impossible values, missing required fields,
#             codes that cannot be mapped.
#   warning:  the row is used, but goes to the MEAL officer's REVIEW QUEUE.
#   info:     logged and counted as a data-quality measure on the dashboard
#             (e.g. "89% of records entered within 30 days"); no one needs to act on a row.
# A flag not listed below is treated as a warning, so nothing slips through unseen.
flag_severity:
  critical:
    - negative_value
    - female_exceeds_total
    - impossible_age
    - impossible_household_size
    - percent_over_100
    - date_outside_project_window
    - entry_before_activity
    - date_unreadable
    - number_unreadable
    - not_whole_number
    - sheet_skipped_unrecognised_layout   # a whole sheet could not be read: see skipped_sheets.csv
    - sheet_skipped_required_fields_missing  # a sheet lacked a required column: not read at all
    - missing_required
    - sex_unmapped
    - status_unmapped
    - app_report_repeats_excel       # a report entered on the dashboard that is already in an Excel file
    - disability_unmapped
    - province_unmapped
    - stage_unmapped
    - donor_type_unmapped
    - district_unrecognised
    - village_unrecognised
    - project_unrecognised
    - activity_unrecognised
    - indicator_unrecognised
    - donor_not_in_donor_list
    - service_unknown_registration
    - probability_word
    - probability_out_of_range
  warning:
    - possible_duplicate_person      # suspected duplicates below the certain-match level
    - possible_duplicate_initials    # initials that match a full name (never merged)
    - accuracy_outlier               # actual more than 3 x target
    - missing_target                 # row kept; the indicator shows "no target set" instead of % achieved
    - district_legacy_name_ambiguous # an old (pre-2006) name that may mean several districts
    - sum_mismatch                   # female + male not equal to total (never auto-fixed)
    - district_province_mismatch
    - status_completed_but_late
    - app_entry_may_repeat_excel     # an activity entered on the dashboard that looks like an Excel record
  info:
    - date_day_unknown
    - id_stored_as_number
    - id_invalid
    - phone_invalid
    - on_time_unverifiable
    - late_entry
    - late_entry_possible
    - age_not_computable             # date of birth or registration date could not be read
    - report_missing                 # shown as reporting completeness (indicator CC-04)
  # A critical problem that the pipeline resolved another way becomes a warning, so a person
  # confirms it: e.g. an unrecognised district filled in from a village that exists in one district only.
  downgrade_when_resolved:
    district_unrecognised: district_filled_from_village
    missing_required: district_filled_from_village

# Duplicates the pipeline is certain about are merged without review (info); the rest are warnings.
# Certain = same national ID, or same phone number AND names scoring at least this much.
duplicate_certain_name_score: 95

# Review queue sizing: minutes the MEAL officer needs per row in the queue (a planning assumption).
review_minutes_per_row: 2
review_budget_minutes_per_month: 60

# -----------------------------------------------------------------------------
# Plain-language labels for the dashboard (no raw codes on screen)
# -----------------------------------------------------------------------------
labels:
  entity:
    activity: Activity record
    beneficiary: Beneficiary registration
    service: Service record
    indicator_result: Indicator report
    opportunity: Donor opportunity
    donor: Donor
  issue:
    accuracy_outlier: Actual more than 3 times the target
    date_outside_project_window: Date outside the project dates
    district_province_mismatch: District not in the stated province
    district_unrecognised: District name not recognised
    entry_before_activity: Entered before the activity took place
    female_exceeds_total: More women than total participants
    impossible_age: Impossible age
    impossible_household_size: Impossible household size
    missing_required: Required field left blank
    missing_target: No target given
    negative_value: Negative number
    number_unreadable: Number could not be read
    percent_over_100: Percentage above 100
    possible_duplicate_person: Possibly the same person registered twice
    probability_word: Probability written in words
    sex_unmapped: Sex not recognised
    status_completed_but_late: Marked completed but done late
    sum_mismatch: Women + men do not equal the total
    village_unrecognised: Village name not recognised
    app_entry_may_repeat_excel: Entered on the dashboard, looks like an Excel record
    app_report_repeats_excel: Entered on the dashboard, already in an Excel report
  reconciliation_status:
    within tolerance: ✔ Within tolerance
    gap above tolerance: ✖ Gap to follow up
    derived only: ○ Records only (no report)
