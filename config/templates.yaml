# =============================================================================
# Standard Excel entry templates for staff
# =============================================================================
# src/build_templates.py turns this file into the .xlsx files in templates/.
# To add a column: add a line under the right sheet and rerun
#     python src/build_templates.py
#
# Column options:
#   header    the text staff see in row 1 (keep it short and plain)
#   required  true if the row is rejected for review when this cell is empty
#   list      name of a dropdown list (see "lists" at the bottom)
#   type      date, whole_number, number or text (Excel checks what is typed)
#   note      a hint shown when the cell is selected
# =============================================================================

templates:
  activity_monitoring_template.xlsx:
    instructions:
      - "One row per activity. Do not merge cells, add totals rows or leave blank rows."
      - "Type dates as dd/mm/yyyy. Use the dropdown lists where they appear."
      - "Female + Male must equal Total participants."
      - "Write the date you typed the row into Excel in 'Date entered'."
    sheets:
      Activities:
        - {header: Activity date, required: true, type: date, note: "Date the activity actually took place (leave empty if cancelled or not yet done)"}
        - {header: Planned date, required: true, type: date, note: "Date in the work plan"}
        - {header: Date entered, required: true, type: date, note: "Date you typed this row"}
        - {header: Project, required: true, list: projects}
        - {header: Activity, required: true, list: activities}
        - {header: District, required: true, list: districts}
        - {header: Sector, required: true, type: text}
        - {header: Cell, required: false, type: text}
        - {header: Village, required: true, type: text}
        - {header: Status, required: true, list: activity_status}
        - {header: Female participants, required: true, type: whole_number}
        - {header: Male participants, required: true, type: whole_number}
        - {header: Total participants, required: true, type: whole_number}
        - {header: Cost (RWF), required: true, type: number, note: "Numbers only, no 'RWF' and no commas"}
        - {header: Field officer, required: true, list: officers}
        - {header: Notes, required: false, type: text}

  beneficiary_register_template.xlsx:
    instructions:
      - "One row per person. Register each person once only: search the sheet first."
      - "Names, phone numbers and ID numbers are personal data. Keep this file on an ARDE/KUBAHO device only."
      - "Type phone and ID numbers as text (they must keep their leading zero and all 16 digits)."
    sheets:
      Register:
        - {header: Reg No, required: true, type: text, note: "Your officer code and a number, e.g. FO01-0001"}
        - {header: Full name, required: true, type: text, note: "Surname first, then given names"}
        - {header: Sex, required: true, list: sex}
        - {header: Age, required: true, type: whole_number}
        - {header: Phone, required: false, type: text}
        - {header: National ID, required: false, type: text}
        - {header: Household size, required: true, type: whole_number}
        - {header: Disability, required: true, list: yes_no}
        - {header: District, required: true, list: districts}
        - {header: Sector, required: true, type: text}
        - {header: Cell, required: false, type: text}
        - {header: Village, required: true, type: text}
        - {header: Project, required: true, list: projects}
        - {header: Registration date, required: true, type: date}
        - {header: Officer code, required: false, list: officers, note: "Optional: the field officer who registered this person"}
      Services:
        - {header: Reg No, required: true, type: text}
        - {header: Activity, required: true, list: activities}
        - {header: Date, required: true, type: date}
        - {header: Service received, required: true, type: text}

  donor_opportunity_template.xlsx:
    instructions:
      - "Who fills this in: the person who follows up funding (e.g. the executive director or a programme manager). Update it at least once a month and before each management meeting."
      - "Donors sheet: one row per donor ORGANISATION. Fill in the Donors sheet first: the Donor column on the Opportunities sheet is a dropdown of the names typed there."
      - "Individual donors: type them as donors with Type = individual. The dashboard never shows their name, only 'Individual donor #001'. Contact person, email and phone are never shown on the dashboard."
      - "OFFLINE FALLBACK ONLY. Donor data is kept on the dashboard's Donor entry page. Use this file only when the dashboard cannot be used (for example away from the office laptop), for NEW opportunities with NEW IDs; import them on the Donor entry page afterwards."
      - "Opportunities sheet: one row per funding opportunity (a call, a proposal, a renewal). Keep the row when it is won or lost: change the Stage."
      - "Stages, in order: Identified (we know about it) - Qualified (we fit and decided to go) - Concept note - Proposal submitted - then the OUTCOME: Awarded or Declined."
      - "Probability: your honest guess that it will be awarded, as a percentage (type 40% or 0.4). The dashboard multiplies the amount requested by it (the 'weighted' value). Declined = 0%; Awarded = 100%."
      - "Amounts in RWF, numbers only (no 'RWF', no commas). When the Stage is Awarded, fill in the Awarded amount."
      - "Thematic fit: pick WASH, Agriculture or both ('WASH; Agriculture'). An opportunity that fits both is split half and half between the themes on the dashboard."
      - "Next action and its date: the one thing to do next, and by when. Dates in the past show in red here and in the 'Overdue next actions' list on the dashboard."
      - "Colours on the Opportunities sheet: red = next action overdue; amber = deadline within 30 days; orange = Awarded with no awarded amount."
    example_heading: "Example rows (for illustration only: type real rows on the Opportunities sheet)"
    examples:
      - [Opp ID, Opportunity title, Donor, Thematic fit, Stage, Deadline, Requested amount (RWF), Awarded amount (RWF), Probability, Owner, Next action, Next action date]
      - [OPP001, Safe water for schools - Kayonza, Example Foundation, WASH, Concept note, 30/09/2026, 150000000, "", 30%, ED, Send concept note, 15/08/2026]
      - [OPP002, Climate-smart farming phase 2, Example Bilateral Agency, Agriculture, Awarded, 01/03/2026, 200000000, 180000000, 100%, PM01, Sign grant agreement, 10/07/2026]
    highlights:
      - {sheet: Opportunities, column: Next action date, when: "AND(ISNUMBER({cell}),{cell}<TODAY(),{col:Stage}<>\"Awarded\",{col:Stage}<>\"Declined\")", colour: F8CBAD, meaning: next action overdue}
      - {sheet: Opportunities, column: Deadline, when: "AND(ISNUMBER({cell}),{cell}>=TODAY(),{cell}<=TODAY()+30)", colour: FFE699, meaning: deadline within 30 days}
      - {sheet: Opportunities, column: Awarded amount (RWF), when: "AND({col:Stage}=\"Awarded\",{cell}=\"\")", colour: F4B183, meaning: awarded but no amount}
    sheets:
      Donors:
        - {header: Donor ID, required: true, type: text, note: "Any short code, e.g. D001. Never reuse a code."}
        - {header: Donor name, required: true, type: text, note: "Organisation name, as you want it on the Opportunities sheet"}
        - {header: Type, required: true, list: donor_types}
        - {header: Country, required: false, type: text}
        - {header: Thematic interests, required: false, type: text, note: "e.g. WASH, climate, women's livelihoods"}
        - {header: Contact person, required: false, type: text, note: "Personal data: never shown on the dashboard"}
        - {header: Email, required: false, type: text, note: "Personal data: never shown on the dashboard"}
        - {header: Phone, required: false, type: text, note: "Personal data: never shown on the dashboard"}
        - {header: Notes, required: false, type: text}
      Opportunities:
        - {header: Opp ID, required: true, type: text, note: "Any short code, e.g. OPP001. Never reuse a code."}
        - {header: Opportunity title, required: true, type: text}
        - {header: Donor, required: true, list_from: {sheet: Donors, header: Donor name}, note: "Pick from the names on the Donors sheet"}
        - {header: Thematic fit, required: true, list: themes}
        - {header: Stage, required: true, list: stages}
        - {header: Deadline, required: false, type: date, note: "Submission deadline (dd/mm/yyyy)"}
        - {header: Requested amount (RWF), required: true, type: number}
        - {header: Awarded amount (RWF), required: false, type: number, note: "Fill in when the Stage is Awarded"}
        - {header: Probability, required: true, type: percent, note: "0% to 100%. Declined = 0%, Awarded = 100%"}
        - {header: Owner, required: true, type: text, note: "Initials or staff code of the person following it up"}
        - {header: Next action, required: false, type: text}
        - {header: Next action date, required: false, type: date}

  indicator_report_template.xlsx:
    instructions:
      - "Monthly indicator report: one row per project, district, month and indicator. Upload it on the dashboard's Upload Excel page (or enter single reports on the Data entry page)."
      - "Reporting period: the first day of the month, e.g. 01/06/2026 for June 2026."
      - "Indicators reported separately for women and men (e.g. AGR-01): one row for Female and one for Male; leave Sex empty for all other indicators."
      - "Monthly target: the target for that month, if there is one. Achieved: numbers only (no %, no text)."
      - "Do not report the same project, district, month and indicator twice (in this file or another one): it would be counted twice and is held back."
    sheets:
      Report:
        - {header: Project code, required: true, list: project_codes}
        - {header: District, required: true, list: districts}
        - {header: Reporting period, required: true, type: date, note: "First day of the month, e.g. 01/06/2026"}
        - {header: Indicator code, required: true, list: reported_indicators}
        - {header: Sex, required: false, list: sex, note: "Only for indicators reported for women and men separately"}
        - {header: Monthly target, required: false, type: number}
        - {header: Achieved, required: true, type: number}
        - {header: Entered by, required: true, list: officers}
        - {header: Comments, required: false, type: text}

# Dropdown lists. "from:" means the list is filled in automatically from another config file.
lists:
  sex: [Female, Male]
  yes_no: ["Yes", "No"]
  activity_status: [Planned, Completed, Delayed, Cancelled]
  districts: {from: rwanda_admin}
  projects: {from: synthetic_projects}        # replace with the real project list in Phase 8
  project_codes: {from: synthetic_project_codes}
  reported_indicators: {from: catalogue_reported}   # indicators reported monthly (catalogue)
  activities: {from: synthetic_activities}    # replace with the real activity list in Phase 8
  officers: {from: synthetic_officers}        # replace with the real officer codes in Phase 8
  donor_types: [bilateral, multilateral, foundation, government, private, individual]
  themes: [WASH, Agriculture, "WASH; Agriculture"]   # match donor_pipeline.themes in settings.yaml
  stages: {from: donor_pipeline_stages}
